<!DOCTYPE html>
<html lang="en" data-gd-theme="orange">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gd5 UI Gallery — themes</title>
  <link rel="stylesheet" href="../src/ui/css/ui.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--gd-font);
      background:
        radial-gradient(ellipse at 12% 0%, var(--gd-primary-soft), transparent 50%),
        var(--gd-bg);
      color: var(--gd-text);
      transition: background-color 200ms ease, color 200ms ease;
    }
    .gallery {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    .gd-theme-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 16px 0 8px;
    }
    .gd-theme-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      vertical-align: -2px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
    }
  </style>
</head>
<body>
  <div id="app" class="gallery"></div>
  <script type="module" src="./ui-gallery.js"></script>
</body>
</html>
