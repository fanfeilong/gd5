<!DOCTYPE html>
<html lang="zh-CN" data-gd-theme="orange">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MarkdownEditor demo</title>
  <link rel="stylesheet" href="../src/ui/css/ui.css" />
  <style>
    body {
      margin: 24px;
      font-family: var(--gd-font);
      background: var(--gd-bg-spotlight);
      color: var(--gd-text);
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .hint { margin: 0 0 16px; color: var(--gd-text-secondary); font-size: 14px; }
    #host { max-width: 920px; }
  </style>
</head>
<body>
  <h1>MarkdownEditor</h1>
  <p class="hint">默认 Markdown 编辑 · 顶部工具栏 · 编辑 / 分栏 / 预览</p>
  <div id="host"></div>
  <script type="module">
    import { MarkdownEditor } from '../src/ui/index.js';

    const ed = new MarkdownEditor({
      height: 360,
      mode: 'split',
      value: [
        '# gd5 Markdown',
        '',
        '默认以 **Markdown** 编辑，顶部工具栏可快速插入格式。',
        '',
        '## 功能',
        '',
        '- 粗体 / 斜体 / 标题',
        '- 引用、列表、链接、行内代码',
        '- 分栏实时预览',
        '',
        '```js',
        'ed.setMode("preview");',
        '```',
        '',
        '> 切换右上角「编辑 / 分栏 / 预览」。',
        '',
        'Visit [gd5](https://github.com/zigslice/gd5).',
      ].join('\n'),
    });
    await ed.mount(document.getElementById('host'));
  </script>
</body>
</html>
